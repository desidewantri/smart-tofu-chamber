; PlatformIO build for the verified bench firmware + MQTT dual send.
; The Arduino IDE opens toscha_esp32_bench.ino directly; this file only enables
; a repeatable compile check.
[platformio]
; Single .ino in this folder, Arduino IDE style.
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit BusIO@^1.16.1
build_flags =
    -DMQTT_MAX_PACKET_SIZE=512
