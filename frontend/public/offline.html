<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>TOSCHA · Tidak ada koneksi</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: linear-gradient(135deg, #f0fdfa, #e6f6f3); color: #134e4a;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { max-width: 420px; width: 100%; background: #fff; border: 1px solid #d5ece7; border-radius: 22px;
    padding: 32px 28px; text-align: center; box-shadow: 0 10px 30px rgba(15, 118, 110, .08); }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 20px; margin: 18px 0 6px; }
  p { margin: 0 0 6px; color: #475569; font-size: 14px; line-height: 1.55; }
  .en { color: #94a3b8; font-size: 13px; }
  button { margin-top: 18px; border: 0; border-radius: 12px; padding: 11px 18px; font: 600 14px/1 inherit;
    background: #0d9488; color: #fff; cursor: pointer; }
  button:focus-visible { outline: 3px solid #99f6e4; outline-offset: 2px; }
</style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="TOSCHA">
    <h1>Tidak ada koneksi internet</h1>
    <p>TOSCHA butuh koneksi untuk menampilkan data chamber terbaru. Periksa internet Anda, lalu coba lagi.</p>
    <p class="en">No internet connection. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
