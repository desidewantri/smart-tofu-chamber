# Mosquitto untuk SERVER (produksi). Laptop tetap memakai mosquitto.conf.
# Hanya user terdaftar yang boleh masuk (ESP32 dan backend). File password dibuat di server,
# lokasinya deploy/mosquitto-passwd (tidak masuk git). Lihat README bagian "MQTT di server".
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# Simpan pesan ketika backend sedang mati/restart, lalu kirim saat backend tersambung lagi
# (backend memakai sesi tetap: clientId tetap + clean=false).
persistence true
persistence_location /mosquitto/data/
persistent_client_expiration 7d
max_queued_messages 5000
queue_qos0_messages true

log_dest stdout
log_type error
log_type warning
log_type notice


# ---------------------------------------------------------------------------
# TLS (belum aktif). Untuk mengaktifkan:
#   1. siapkan sertifikat server (mis. Let's Encrypt) dan CA
#   2. buka blok di bawah dan sesuaikan path
#   3. buka port 8883 di firewall
#   4. set MQTT_USE_TLS 1 dan MQTT_CA_CERT di firmware config_secrets.h
# Tanpa blok ini, kredensial MQTT berjalan plaintext di port 1883.
# ---------------------------------------------------------------------------
# listener 8883
# allow_anonymous false
# password_file /mosquitto/config/passwd
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
