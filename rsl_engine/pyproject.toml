[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tofusense-rsl-engine"
version = "1.0.0"
description = "TofuSense frozen v2.3 RSL runtime engine (M1 empirical envelope, M2 Turnbull NPMLE, M3 Weibull A0)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tofusense_rsl = ["reference/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
